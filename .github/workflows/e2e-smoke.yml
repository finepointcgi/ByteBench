# End-to-end smoke tier: Playwright drives the real UI of a real ByteBench server (temp SQLite DB, seeded demo accounts, random port).
# No Docker is involved. Runs on every pull request; locally: e2e/run.sh smoke. See docs/testing.md.
name: E2E smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build the server
        run: dotnet build ByteBench.csproj -warnaserror
      - name: Install the e2e dependencies and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run the smoke tier
        working-directory: e2e
        env:
          E2E_TIER: smoke
          E2E_NO_BUILD: "1"
        run: npx playwright test --project=smoke
      - name: Upload traces, screenshots, videos and the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14
