name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build ByteBench.sln -warnaserror
      - name: Test (without Docker)
        run: dotnet test ByteBench.sln --no-build --filter "Category!=Docker" --logger "console;verbosity=normal"
