appId: com.bytebench.desktop
productName: ByteBench
copyright: ByteBench contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - resources/**
  - package.json
  - "!**/*.map"
asar: true
# Hardening of the packaged Electron binary (electron-builder flips these fuses at build time).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
protocols:
  - name: ByteBench
    schemes:
      - bytebench
# Auto-update feed: the rolling "desktop-latest" GitHub release (see desktop/README.md).
publish:
  - provider: generic
    url: https://github.com/finepointcgi/ByteBench/releases/download/desktop-latest
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing is picked up from CSC_LINK / CSC_KEY_PASSWORD; notarization from APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
  notarize: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: ByteBench contributors
  synopsis: Desktop app for ByteBench servers
  mimeTypes:
    - x-scheme-handler/bytebench
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
