<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<title>Find</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="overlay">
<div class="findbar">
  <input id="q" type="text" placeholder="Find in page" autocomplete="off" spellcheck="false" aria-label="Find in page">
  <span id="count" class="count"></span>
  <button id="prev" title="Previous (Shift+Enter)" aria-label="Previous match">&#9650;</button>
  <button id="next" title="Next (Enter)" aria-label="Next match">&#9660;</button>
  <button id="close" title="Close (Esc)" aria-label="Close">&#10005;</button>
</div>
<script src="find.js"></script>
</body>
</html>
